# 1. Panel API Service (Exposes ONLY port 2222 for Panel mTLS connection via Tailscale / LoadBalancer)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "remnanode.fullname" . }}-api
  labels:
    {{- include "remnanode.labels" . | nindent 4 }}
spec:
  type: {{ dig "service" "type" "LoadBalancer" .Values.node }}
  selector:
    {{- include "remnanode.selectorLabels" . | nindent 4 }}
    role: leader
  ports:
    - name: api
      port: {{ dig "service" "port" (default 2222 .Values.node.apiPort) .Values.node }}
      targetPort: {{ default 2222 .Values.node.apiPort }}
      protocol: TCP
---
# 2. Inbound Internal Service (Always ClusterIP - used by Traefik IngressRoute / IngressRouteTCP for Reality/Trojan/WS)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "remnanode.fullname" . }}
  labels:
    {{- include "remnanode.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "remnanode.selectorLabels" . | nindent 4 }}
    role: leader
  ports:
    - name: api-internal
      port: {{ default 2222 .Values.node.apiPort }}
      targetPort: {{ default 2222 .Values.node.apiPort }}
      protocol: TCP
    {{- range .Values.inbounds }}
    {{- if ne .mode "direct" }}
    - name: {{ lower (default "tcp" .protocol) }}-{{ .port }}
      port: {{ .port }}
      targetPort: {{ .port }}
      protocol: {{ default "TCP" .protocol | upper }}
    {{- end }}
    {{- end }}
{{- if .Values.peerSync.enabled }}
---
# Headless Service for peer discovery and sync (PeerSync)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "remnanode.fullname" . }}-headless
  labels:
    {{- include "remnanode.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "remnanode.selectorLabels" . | nindent 4 }}
  ports:
    - name: peer-sync
      port: {{ default 3000 .Values.node.healthPort }}
      targetPort: {{ default 3000 .Values.node.healthPort }}
      protocol: TCP
{{- end }}
{{- if and .Values.directUdp .Values.directUdp.enabled }}
---
# Direct UDP Service (Hysteria 2 / TUIC) with real client IP retention
apiVersion: v1
kind: Service
metadata:
  name: {{ include "remnanode.fullname" . }}-udp
  labels:
    {{- include "remnanode.labels" . | nindent 4 }}
spec:
  type: {{ default "LoadBalancer" .Values.directUdp.serviceType }}
  externalTrafficPolicy: {{ default "Local" .Values.directUdp.externalTrafficPolicy }}
  selector:
    {{- include "remnanode.selectorLabels" . | nindent 4 }}
  ports:
    {{- range .Values.directUdp.ports }}
    - port: {{ .port }}
      name: {{ default (printf "udp-%d" (int .port)) .name }}
      targetPort: {{ default .port .targetPort }}
      protocol: UDP
    {{- end }}
{{- end }}
