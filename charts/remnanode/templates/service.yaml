# 1. Panel API Service (Exposes ONLY port 2222 for Panel mTLS connection via Tailscale / LoadBalancer)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "remnanode.fullname" . }}-api
  labels:
    {{- include "remnanode.labels" . | nindent 4 }}
spec:
  type: {{ dig "service" "type" "LoadBalancer" .Values.node }}
  selector:
    {{- include "remnanode.selectorLabels" . | nindent 4 }}
    role: leader
  ports:
    - name: api
      port: {{ dig "service" "port" (default 2222 .Values.node.apiPort) .Values.node }}
      targetPort: {{ default 2222 .Values.node.apiPort }}
      protocol: TCP
---
# 2. Inbound Internal Service (Always ClusterIP - used by Traefik IngressRoute / IngressRouteTCP for Reality/Trojan/WS)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "remnanode.fullname" . }}
  labels:
    {{- include "remnanode.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "remnanode.selectorLabels" . | nindent 4 }}
    role: leader
  ports:
    - name: api-internal
      port: {{ default 2222 .Values.node.apiPort }}
      targetPort: {{ default 2222 .Values.node.apiPort }}
      protocol: TCP
    {{- range .Values.inbounds }}
    {{- if ne .mode "direct" }}
    {{- $proto := lower (default "tcp" .protocol) }}
    {{- $target := default .port .targetPort }}
    {{- if or (eq $proto "both") (eq $proto "tcp/udp") (eq $proto "udp/tcp") }}
    - name: tcp-{{ .port }}
      port: {{ .port }}
      targetPort: {{ $target }}
      protocol: TCP
    - name: udp-{{ .port }}
      port: {{ .port }}
      targetPort: {{ $target }}
      protocol: UDP
    {{- else if eq $proto "udp" }}
    - name: udp-{{ .port }}
      port: {{ .port }}
      targetPort: {{ $target }}
      protocol: UDP
    {{- else }}
    - name: tcp-{{ .port }}
      port: {{ .port }}
      targetPort: {{ $target }}
      protocol: TCP
    {{- end }}
    {{- end }}
    {{- end }}
{{- if .Values.peerSync.enabled }}
---
# Headless Service for peer discovery and sync (PeerSync)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "remnanode.fullname" . }}-headless
  labels:
    {{- include "remnanode.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "remnanode.selectorLabels" . | nindent 4 }}
  ports:
    - name: peer-sync
      port: {{ default 3000 .Values.node.healthPort }}
      targetPort: {{ default 3000 .Values.node.healthPort }}
      protocol: TCP
{{- end }}
