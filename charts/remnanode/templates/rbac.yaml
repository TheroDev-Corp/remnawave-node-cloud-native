{{- if .Values.leaderElection.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "remnanode.fullname" . }}-sa
  labels:
    {{- include "remnanode.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "remnanode.fullname" . }}-role
  labels:
    {{- include "remnanode.labels" . | nindent 4 }}
rules:
  {{- if and .Values.leaderElection.traefikMiddleware .Values.leaderElection.traefikMiddleware.enabled }}
  - apiGroups: ["traefik.io"]
    resources: ["middlewaretcps"]
    resourceNames: [{{ .Values.leaderElection.traefikMiddleware.name | quote }}]
    verbs: ["get", "update", "patch"]
  {{- end }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ .Values.leaderElection.leaseName | quote }}]
    verbs: ["get", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "remnanode.fullname" . }}-rolebinding
  labels:
    {{- include "remnanode.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "remnanode.fullname" . }}-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "remnanode.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
